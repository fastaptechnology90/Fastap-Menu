kind = "web"
previewPath = "/"
title = "Fastap Super Admin Panel"
version = "1.0.0"
id = "artifacts/fastap-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20848

[services.development]
run = "pnpm --filter @workspace/fastap-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fastap-admin", "run", "build" ]
publicDir = "artifacts/fastap-admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20848"
BASE_PATH = "/"
