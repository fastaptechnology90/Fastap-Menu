components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # ─── AUTH ─────────────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [restaurant_owner, super_admin]
      required: [name, email, password]

    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required: [user, message]

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [super_admin, restaurant_owner, staff, customer]
        createdAt:
          type: string
          format: date-time
      required: [id, email, name, role, createdAt]

    # ─── SUPER ADMIN ──────────────────────────────────────────────────────────
    SuperAdminStats:
      type: object
      properties:
        totalRestaurants:
          type: integer
        activeRestaurants:
          type: integer
        totalUsers:
          type: integer
        totalOrders:
          type: integer
        totalRevenue:
          type: number
        planBreakdown:
          type: object
          properties:
            free:
              type: integer
            starter:
              type: integer
            pro:
              type: integer
            enterprise:
              type: integer
          required: [free, starter, pro, enterprise]
        recentRestaurants:
          type: array
          items:
            $ref: "#/components/schemas/RestaurantWithOwner"
      required: [totalRestaurants, activeRestaurants, totalUsers, totalOrders, totalRevenue, planBreakdown, recentRestaurants]

    RestaurantWithOwner:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: ["string", "null"]
        plan:
          type: string
        isActive:
          type: boolean
        ownerName:
          type: string
        ownerEmail:
          type: string
        totalOrders:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, slug, plan, isActive, ownerName, ownerEmail, totalOrders, createdAt]

    Plan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        currency:
          type: string
        features:
          type: array
          items:
            type: string
        maxBranches:
          type: integer
        maxItems:
          type: integer
        maxStaff:
          type: integer
      required: [id, name, price, currency, features, maxBranches, maxItems, maxStaff]

    PlanUpdate:
      type: object
      properties:
        plan:
          type: string
          enum: [free, starter, pro, enterprise]
      required: [plan]

    # ─── RESTAURANT ───────────────────────────────────────────────────────────
    Restaurant:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        currency:
          type: string
        primaryColor:
          type: string
        businessType:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
        isActive:
          type: boolean
        plan:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, userId, name, slug, currency, primaryColor, isActive, plan, createdAt]

    RestaurantInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        currency:
          type: string
        primaryColor:
          type: string
        businessType:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
      required: [name, currency, primaryColor]

    DashboardSummary:
      type: object
      properties:
        todayOrders:
          type: integer
        todayRevenue:
          type: number
        activeOrders:
          type: integer
        totalCustomers:
          type: integer
        qrScansToday:
          type: integer
        pendingReservations:
          type: integer
        lowStockItems:
          type: integer
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        activeWaiterCalls:
          type: integer
      required: [todayOrders, todayRevenue, activeOrders, totalCustomers, qrScansToday, pendingReservations, lowStockItems, recentOrders, activeWaiterCalls]

    # ─── BRANCH ───────────────────────────────────────────────────────────────
    Branch:
      type: object
      properties:
        id:
          type: integer
        restaurantId:
          type: integer
        name:
          type: string
        address:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, restaurantId, name, isActive, createdAt]

    BranchInput:
      type: object
      properties:
        name:
          type: string
        address:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        isActive:
          type: boolean
      required: [name]

    # ─── TABLE ────────────────────────────────────────────────────────────────
    Table:
      type: object
      properties:
        id:
          type: integer
        restaurantId:
          type: integer
        branchId:
          type: ["integer", "null"]
        name:
          type: string
        zone:
          type: ["string", "null"]
        capacity:
          type: integer
        qrCodeUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, restaurantId, name, capacity, isActive, createdAt]

    TableInput:
      type: object
      properties:
        name:
          type: string
        branchId:
          type: ["integer", "null"]
        zone:
          type: ["string", "null"]
        capacity:
          type: integer
        isActive:
          type: boolean
      required: [name, capacity]

    # ─── CATEGORY ─────────────────────────────────────────────────────────────
    Category:
      type: object
      properties:
        id:
          type: integer
        restaurantId:
          type: integer
        name:
          type: string
        imageUrl:
          type: ["string", "null"]
        sortOrder:
          type: integer
        isAvailable:
          type: boolean
        availableFrom:
          type: ["string", "null"]
        availableTo:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, restaurantId, name, sortOrder, isAvailable, createdAt]

    CategoryInput:
      type: object
      properties:
        name:
          type: string
        imageUrl:
          type: ["string", "null"]
        sortOrder:
          type: integer
        isAvailable:
          type: boolean
        availableFrom:
          type: ["string", "null"]
        availableTo:
          type: ["string", "null"]
      required: [name]

    # ─── MENU ITEM ────────────────────────────────────────────────────────────
    MenuItem:
      type: object
      properties:
        id:
          type: integer
        restaurantId:
          type: integer
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        discountedPrice:
          type: ["number", "null"]
        imageUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        ingredients:
          type: ["string", "null"]
        allergens:
          type: ["string", "null"]
        calories:
          type: ["integer", "null"]
        prepTime:
          type: ["integer", "null"]
        spiceLevel:
          type: integer
        dietaryTags:
          type: array
          items:
            type: string
        isAvailable:
          type: boolean
        isFeatured:
          type: boolean
        sortOrder:
          type: integer
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ItemVariant"
        addons:
          type: array
          items:
            $ref: "#/components/schemas/ItemAddon"
        createdAt:
          type: string
          format: date-time
      required: [id, restaurantId, categoryId, name, price, spiceLevel, dietaryTags, isAvailable, isFeatured, sortOrder, variants, addons, createdAt]

    ItemVariant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        priceDiff:
          type: number
      required: [id, name, priceDiff]

    ItemAddon:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
      required: [id, name, price]

    MenuItemInput:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        discountedPrice:
          type: ["number", "null"]
        imageUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        ingredients:
          type: ["string", "null"]
        allergens:
          type: ["string", "null"]
        calories:
          type: ["integer", "null"]
        prepTime:
          type: ["integer", "null"]
        spiceLevel:
          type: integer
        dietaryTags:
          type: array
          items:
            type: string
        isAvailable:
          type: boolean
        isFeatured:
          type: boolean
        sortOrder:
          type: integer
        variants:
          type: array
          items:
            $ref: "#/components/schemas/VariantInput"
        addons:
          type: array
          items:
            $ref: "#/components/schemas/AddonInput"
      required: [categoryId, name, price]

    VariantInput:
      type: object
      properties:
        name:
          type: string
        priceDiff:
          type: number
      required: [name, priceDiff]

    AddonInput:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
      required: [name, price]

    # ─── QR CODE ──────────────────────────────────────────────────────────────
    QrCode:
      type: object
      properties:
        id:
          type: integer
        restaurantId:
          type: integer
        tableId:
          type: ["integer", "null"]
        label:
          type: string
        type:
          type: string
          enum: [table, room, zone, counter, event]
        url:
          type: string
        scans:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, restaurantId, label, type, url, scans, createdAt]

    QrCodeInput:
      type: object
      properties:
        tableId:
          type: ["integer", "null"]
        label:
          type: string
        type:
          type: string
          enum: [table, room, zone, counter, event]
      required: [label, type]

    # ─── ORDER ────────────────────────────────────────────────────────────────
    Order:
      type: object
      properties:
        id:
          type: integer
        restaurantId:
          type: integer
        tableId:
          type: ["integer", "null"]
        tableName:
          type: ["string", "null"]
        customerName:
          type: ["string", "null"]
        customerPhone:
          type: ["string", "null"]
        customerEmail:
          type: ["string", "null"]
        type:
          type: string
          enum: [dine_in, delivery, takeaway]
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, delivered, completed, cancelled]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          type: number
        tax:
          type: number
        total:
          type: number
        notes:
          type: ["string", "null"]
        deliveryAddress:
          type: ["string", "null"]
        paymentMethod:
          type: ["string", "null"]
        paymentStatus:
          type: string
          enum: [pending, paid, failed]
        createdAt:
          type: string
          format: date-time
      required: [id, restaurantId, type, status, items, subtotal, tax, total, paymentStatus, createdAt]

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        menuItemId:
          type: integer
        name:
          type: string
        price:
          type: number
        quantity:
          type: integer
        variant:
          type: ["string", "null"]
        addons:
          type: array
          items:
            type: string
        notes:
          type: ["string", "null"]
        subtotal:
          type: number
      required: [id, menuItemId, name, price, quantity, addons, subtotal]

    OrderStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, delivered, completed, cancelled]
      required: [status]

    PlaceOrderInput:
      type: object
      properties:
        restaurantId:
          type: integer
        tableId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        customerPhone:
          type: ["string", "null"]
        customerEmail:
          type: ["string", "null"]
        type:
          type: string
          enum: [dine_in, delivery, takeaway]
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlaceOrderItemInput"
        notes:
          type: ["string", "null"]
        deliveryAddress:
          type: ["string", "null"]
        paymentMethod:
          type: ["string", "null"]
      required: [restaurantId, type, items]

    PlaceOrderItemInput:
      type: object
      properties:
        menuItemId:
          type: integer
        quantity:
          type: integer
        variant:
          type: ["string", "null"]
        addons:
          type: array
          items:
            type: string
        notes:
          type: ["string", "null"]
      required: [menuItemId, quantity]

    OrderStatusResponse:
      type: object
      properties:
        orderId:
          type: integer
        status:
          type: string
        estimatedTime:
          type: ["integer", "null"]
        updatedAt:
          type: string
          format: date-time
      required: [orderId, status, updatedAt]

    # ─── STAFF ────────────────────────────────────────────────────────────────
    StaffMember:
      type: object
      properties:
        id:
          type: integer
        restaurantId:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [manager, waiter, kitchen, cashier]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, restaurantId, name, email, role, isActive, createdAt]

    StaffInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [manager, waiter, kitchen, cashier]
        isActive:
          type: boolean
      required: [name, email, role]

    # ─── CUSTOMER / CRM ───────────────────────────────────────────────────────
    Customer:
      type: object
      properties:
        id:
          type: integer
        restaurantId:
